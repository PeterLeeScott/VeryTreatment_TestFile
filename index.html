e:clamp(36px,4.4vw,64px);color:#FFFFFF\">They've <\u002Fspan>\n        <em style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(42px,5.2vw,76px);color:#2B2A2A\">aced<\u002Fem>\n        <span style=\"font-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(36px,4.4vw,64px);color:#FFFFFF\"> Christmas.<\u002Fspan>\n      <\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- ========== 04 ANIMATION & VISUAL WORLD ========== -->\n<section id=\"animation\" data-screen-label=\"Animation &amp; Visual World\">\n<div style=\"background:#9B0055;position:relative;overflow:hidden;min-height:74vh;display:flex;align-items:flex-end\">\n  <div style=\"position:absolute;right:-3vw;top:-6vw;font-family:'Anton',sans-serif;font-size:clamp(260px,38vw,600px);line-height:1;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.14);pointer-events:none;user-select:none\">04<\u002Fdiv>\n  <div style=\"width:100%;max-width:1400px;margin:0 auto;padding:110px 6vw 9vh 6vw;position:relative\">\n    <div style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#F7A9D2;margin-bottom:28px\">04 / 10 — Animation &amp; Visual World<\u002Fdiv>\n    <h2 style=\"margin:0;line-height:.94\">\n      <span style=\"display:block;font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(40px,6.6vw,108px);color:#FFFFFF\">Real enough to believe.<\u002Fspan>\n      <span style=\"display:block;font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(40px,6.6vw,108px);color:#FFFFFF\">Magical enough to <em style=\"font-family:'Instrument Serif',serif;font-style:italic;text-transform:none;font-weight:400;font-size:1.18em;color:#F7A9D2\">dream.<\u002Fem><\u002Fspan>\n    <\u002Fh2>\n  <\u002Fdiv>\n<\u002Fdiv>\n<svg sc-camel-view-box=\"0 0 1440 70\" sc-camel-preserve-aspect-ratio=\"none\" style=\"display:block;width:100%;height:70px\"><path d=\"M0 0 L1440 0 L1440 14 C1050 78 390 78 0 14 Z\" fill=\"#9B0055\"><\u002Fpath><\u002Fsvg>\n\n<div style=\"max-width:1400px;margin:80px auto 0 auto;padding:0 6vw;display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(40px,6vw,90px);align-items:end\" data-reveal=\"1\">\n  <p style=\"margin:0;line-height:1.1\"><span style=\"font-family:'Anton',sans-serif;text-transform:uppercase;letter-spacing:.01em;font-size:clamp(26px,3.2vw,50px);color:#2B2A2A\">I want to find a sweet spot between the tactile richness of a premium Christmas film and <\u002Fspan><em style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(30px,3.8vw,60px);color:#DD007A\">the freedom of animation.<\u002Fem><\u002Fp>\n  <p style=\"margin:0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.7\">The Flock should feel full of personality, while the worlds around them can stretch, expand and behave in ways that simply wouldn't be possible in live action.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"max-width:1400px;margin:clamp(48px,6vw,80px) auto 0 auto;padding:0 6vw\" data-reveal=\"1\">\n  <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:24px;border-top:1px solid #EBD5E2;padding-top:16px;margin-bottom:26px\">\n    <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#9B0055\">Five worlds · one universe<\u002Fspan>\n    <span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(16px,1.5vw,22px);color:#DD007A\">connected by one level of craft<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(12px,1.6vw,22px)\">\n  <div>\n    <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#faf1f6,#faf1f6 14px,#f3e3ec 14px,#f3e3ec 28px);border:1px dashed #d9a8c6;aspect-ratio:3/4\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#a8517f;background:rgba(255,255,255,.9);padding:9px 16px;text-transform:uppercase;text-align:center;font-size:10px;padding:6px 8px\">Image — The Flock's Home<\u002Fspan><\u002Fdiv>\n    <div style=\"height:5px;background:#DD007A;margin-top:12px\"><\u002Fdiv>\n    <div style=\"display:flex;align-items:baseline;gap:8px;margin-top:12px\">\n      <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:11px;letter-spacing:.14em;color:#DD007A\">01<\u002Fspan>\n      <span style=\"font-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(14px,1.4vw,20px);color:#2B2A2A;line-height:1.05\">The Flock's Home<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(14px,1.25vw,18px);color:#9B0055;margin-top:4px\">tactile &amp; warm<\u002Fdiv>\n  <\u002Fdiv>\n  <div>\n    <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#faf1f6,#faf1f6 14px,#f3e3ec 14px,#f3e3ec 28px);border:1px dashed #d9a8c6;aspect-ratio:3/4\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#a8517f;background:rgba(255,255,255,.9);padding:9px 16px;text-transform:uppercase;text-align:center;font-size:10px;padding:6px 8px\">Image — Mountains<\u002Fspan><\u002Fdiv>\n    <div style=\"height:5px;background:#E9358F;margin-top:12px\"><\u002Fdiv>\n    <div style=\"display:flex;align-items:baseline;gap:8px;margin-top:12px\">\n      <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:11px;letter-spacing:.14em;color:#E9358F\">02<\u002Fspan>\n      <span style=\"font-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(14px,1.4vw,20px);color:#2B2A2A;line-height:1.05\">Mountains<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(14px,1.25vw,18px);color:#9B0055;margin-top:4px\">crisp scale<\u002Fdiv>\n  <\u002Fdiv>\n  <div>\n    <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#faf1f6,#faf1f6 14px,#f3e3ec 14px,#f3e3ec 28px);border:1px dashed #d9a8c6;aspect-ratio:3/4\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#a8517f;background:rgba(255,255,255,.9);padding:9px 16px;text-transform:uppercase;text-align:center;font-size:10px;padding:6px 8px\">Image — Coffee Fields<\u002Fspan><\u002Fdiv>\n    <div style=\"height:5px;background:#C2006B;margin-top:12px\"><\u002Fdiv>\n    <div style=\"display:flex;align-items:baseline;gap:8px;margin-top:12px\">\n      <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:11px;letter-spacing:.14em;color:#C2006B\">03<\u002Fspan>\n      <span style=\"font-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(14px,1.4vw,20px);color:#2B2A2A;line-height:1.05\">Coffee Fields<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(14px,1.25vw,18px);color:#9B0055;margin-top:4px\">lush &amp; verdant<\u002Fdiv>\n  <\u002Fdiv>\n  <div>\n    <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#faf1f6,#faf1f6 14px,#f3e3ec 14px,#f3e3ec 28px);border:1px dashed #d9a8c6;aspect-ratio:3/4\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#a8517f;background:rgba(255,255,255,.9);padding:9px 16px;text-transform:uppercase;text-align:center;font-size:10px;padding:6px 8px\">Image — The Spa<\u002Fspan><\u002Fdiv>\n    <div style=\"height:5px;background:#F26BA8;margin-top:12px\"><\u002Fdiv>\n    <div style=\"display:flex;align-items:baseline;gap:8px;margin-top:12px\">\n      <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:11px;letter-spacing:.14em;color:#F26BA8\">04<\u002Fspan>\n      <span style=\"font-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(14px,1.4vw,20px);color:#2B2A2A;line-height:1.05\">The Spa<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(14px,1.25vw,18px);color:#9B0055;margin-top:4px\">enveloping warmth<\u002Fdiv>\n  <\u002Fdiv>\n  <div>\n    <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#faf1f6,#faf1f6 14px,#f3e3ec 14px,#f3e3ec 28px);border:1px dashed #d9a8c6;aspect-ratio:3/4\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#a8517f;background:rgba(255,255,255,.9);padding:9px 16px;text-transform:uppercase;text-align:center;font-size:10px;padding:6px 8px\">Image — Space<\u002Fspan><\u002Fdiv>\n    <div style=\"height:5px;background:#A80059;margin-top:12px\"><\u002Fdiv>\n    <div style=\"display:flex;align-items:baseline;gap:8px;margin-top:12px\">\n      <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:11px;letter-spacing:.14em;color:#A80059\">05<\u002Fspan>\n      <span style=\"font-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(14px,1.4vw,20px);color:#2B2A2A;line-height:1.05\">Space<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(14px,1.25vw,18px);color:#9B0055;margin-top:4px\">infinite expanse<\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"max-width:1400px;margin:clamp(40px,5vw,64px) auto 0 auto;padding:0 6vw\" data-reveal=\"1\">\n  <p style=\"margin:0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.7;max-width:52em\">Every environment will have its own visual identity, from the crisp scale of the mountains to the lushness of the coffee fields, the enveloping warmth of the spa and the infinite expanse of space. But they should all feel as though they belong to <em style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:1.15em;color:#DD007A\">the same universe<\u002Fem>, connected by a consistent level of craft and aesthetic.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"width:100vw;margin:clamp(56px,7vw,96px) 0 0 calc(50% - 50vw);background:#191419\" data-reveal=\"1\">\n  <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#221C26,#221C26 14px,#2A2330 14px,#2A2330 28px);border:1px dashed #6b4a63;aspect-ratio:21/9\">\n    <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#E9A8CC;background:rgba(20,16,22,.75);padding:9px 16px;text-transform:uppercase;text-align:center\">Image/GIF — Texture study: the details that make a home lived in<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"max-width:1400px;margin:0 auto;padding:clamp(40px,5vw,72px) 6vw;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(40px,6vw,90px);align-items:center\">\n    <p style=\"margin:0;line-height:1.14\"><span style=\"font-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(22px,2.4vw,36px);color:#FFFFFF\">The details should tell us something about the people who inhabit these worlds.<\u002Fspan><\u002Fp>\n    <p style=\"margin:0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.7;color:#EDE6EC\">From the textures and objects within each dream to the smaller personal touches that make the family home feel <em style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:1.15em;color:#F7A9D2\">lived in, full of memories and character<\u002Fem>.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"margin:72px 0 0 0;padding:0 6vw\" data-reveal=\"1\">\n  <p style=\"margin:0 auto;max-width:1400px;line-height:1.12;text-wrap:balance\">\n    <span style=\"font-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(30px,4.2vw,66px);color:#2B2A2A\">We're not trying to make an animated version of reality. <\u002Fspan>\n    <span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(34px,4.8vw,76px);color:#DD007A\">We're building Eddie's version of it.<\u002Fspan>\n  <\u002Fp>\n<\u002Fdiv>\n<div style=\"height:80px\"><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ========== 05 CHARACTERS ========== -->\n<section id=\"characters\" data-screen-label=\"Characters &amp; Performance\">\n<div style=\"background:#DD007A;position:relative;overflow:hidden;min-height:74vh;display:flex;align-items:flex-end\">\n  <div style=\"position:absolute;right:-3vw;top:-6vw;font-family:'Anton',sans-serif;font-size:clamp(260px,38vw,600px);line-height:1;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.18);pointer-events:none;user-select:none\">05<\u002Fdiv>\n  <div style=\"width:100%;max-width:1400px;margin:0 auto;padding:110px 6vw 9vh 6vw;position:relative\">\n    <div style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.85);margin-bottom:28px\">05 / 10 — Characters &amp; Performance<\u002Fdiv>\n    <h2 style=\"margin:0;line-height:.94\">\n      <span style=\"display:block;font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(40px,6.6vw,108px);color:#FFFFFF\">The comedy lives<\u002Fspan>\n      <span style=\"display:block;font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(40px,6.6vw,108px);color:#FFFFFF\">in the <em style=\"font-family:'Instrument Serif',serif;font-style:italic;text-transform:none;font-weight:400;font-size:1.18em;color:#2B2A2A\">details.<\u002Fem><\u002Fspan>\n    <\u002Fh2>\n  <\u002Fdiv>\n<\u002Fdiv>\n<svg sc-camel-view-box=\"0 0 1440 70\" sc-camel-preserve-aspect-ratio=\"none\" style=\"display:block;width:100%;height:70px\"><path d=\"M0 0 L1440 0 L1440 14 C1050 78 390 78 0 14 Z\" fill=\"#DD007A\"><\u002Fpath><\u002Fsvg>\n\n<div style=\"max-width:1400px;margin:90px auto 0 auto;padding:0 6vw\" data-reveal=\"1\">\n  <p style=\"margin:0;line-height:1.12;text-wrap:balance\"><span style=\"font-family:'Anton',sans-serif;text-transform:uppercase;letter-spacing:.01em;font-size:clamp(28px,3.6vw,56px);color:#2B2A2A\">The Flock are the core of the film. Their personalities need to come through in <\u002Fspan><em style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(32px,4.1vw,64px);color:#DD007A\">the smallest gestures and reactions with the precious time we have with them.<\u002Fem><\u002Fp>\n<\u002Fdiv>\n\n<div style=\"max-width:1400px;margin:72px auto 0 auto;padding:0 6vw;display:grid;grid-template-columns:repeat(4,1fr);gap:26px\" data-reveal=\"1\">\n  <div>\n    <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#faf1f6,#faf1f6 14px,#f3e3ec 14px,#f3e3ec 28px);border:1px dashed #d9a8c6;aspect-ratio:1/1\">\n      <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:11px;letter-spacing:.08em;color:#a8517f;background:rgba(255,255,255,.9);padding:7px 10px;text-transform:uppercase;text-align:center\">Image — Eddie, wide-eyed<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"margin-top:14px;font-family:'Instrument Serif',serif;font-style:italic;font-size:22px;color:#2B2A2A\">Eddie<\u002Fdiv>\n    <div style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:11px;letter-spacing:.12em;color:#DD007A;text-transform:uppercase;margin-top:4px\">curiosity &amp; hunger for adventure<\u002Fdiv>\n  <\u002Fdiv>\n  <div>\n    <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#faf1f6,#faf1f6 14px,#f3e3ec 14px,#f3e3ec 28px);border:1px dashed #d9a8c6;aspect-ratio:1/1\">\n      <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:11px;letter-spacing:.08em;color:#a8517f;background:rgba(255,255,255,.9);padding:7px 10px;text-transform:uppercase;text-align:center\">Image — Yazmin, mid-adventure<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"margin-top:14px;font-family:'Instrument Serif',serif;font-style:italic;font-size:22px;color:#2B2A2A\">Yazmin<\u002Fdiv>\n    <div style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:11px;letter-spacing:.12em;color:#DD007A;text-transform:uppercase;margin-top:4px\">throws herself into adventure<\u002Fdiv>\n  <\u002Fdiv>\n  <div>\n    <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#faf1f6,#faf1f6 14px,#f3e3ec 14px,#f3e3ec 28px);border:1px dashed #d9a8c6;aspect-ratio:1/1\">\n      <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:11px;letter-spacing:.08em;color:#a8517f;background:rgba(255,255,255,.9);padding:7px 10px;text-transform:uppercase;text-align:center\">Image — Vince, the sip<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"margin-top:14px;font-family:'Instrument Serif',serif;font-style:italic;font-size:22px;color:#2B2A2A\">Vince<\u002Fdiv>\n    <div style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:11px;letter-spacing:.12em;color:#DD007A;text-transform:uppercase;margin-top:4px\">naturally connects with people<\u002Fdiv>\n  <\u002Fdiv>\n  <div>\n    <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#faf1f6,#faf1f6 14px,#f3e3ec 14px,#f3e3ec 28px);border:1px dashed #d9a8c6;aspect-ratio:1/1\">\n      <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:11px;letter-spacing:.08em;color:#a8517f;background:rgba(255,255,255,.9);padding:7px 10px;text-transform:uppercase;text-align:center\">Image — Rebecca, at peace<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"margin-top:14px;font-family:'Instrument Serif',serif;font-style:italic;font-size:22px;color:#2B2A2A\">Rebecca<\u002Fdiv>\n    <div style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:11px;letter-spacing:.12em;color:#DD007A;text-transform:uppercase;margin-top:4px\">a moment to escape the chaos<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"max-width:1400px;margin:90px auto 0 auto;padding:0 6vw;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(40px,7vw,110px);align-items:center\">\n  <div data-reveal=\"1\">\n    <p style=\"margin:0 0 24px 0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.7\">Eddie's curiosity and hunger for adventure come through in every action. An excitable look over the mountain edge, his playful swimming pool bomb, or the moment his eyes open beneath the Milky Way will tell us <em style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:1.15em;color:#DD007A\">everything about him<\u002Fem>.<\u002Fp>\n    <p style=\"margin:0 0 44px 0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.7\">The rest of the family's personalities need to come across just as quickly. Yazmin throws herself into adventure, Vince naturally connects with the people around him, while Rebecca finally gets a moment to escape the chaos of family life.<\u002Fp>\n    <p style=\"margin:0 0 10px 0;font-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(24px,2.6vw,38px);color:#2B2A2A;line-height:1.1\">And let's not forget <span style=\"color:#DD007A\">the goat.<\u002Fspan><\u002Fp>\n    <p style=\"margin:0 0 22px 0;font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(22px,2.2vw,30px);color:#DD007A\">The Robin to our Batman.<\u002Fp>\n    <p style=\"margin:0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.7\">I see him almost like a little Pixar side character; one of those added layers that brings warmth, humour and charm to this beautiful little story.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"position:relative\" data-reveal=\"1\">\n    <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#faf1f6,#faf1f6 14px,#f3e3ec 14px,#f3e3ec 28px);border:1px dashed #d9a8c6;aspect-ratio:1/1\">\n      <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#a8517f;background:rgba(255,255,255,.9);padding:9px 16px;text-transform:uppercase;text-align:center\">Image/GIF — The goat<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<div style=\"height:150px\"><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ========== 06 ART DIRECTION & AI ========== -->\n<section id=\"art\" data-screen-label=\"Art Direction &amp; AI Approach\">\n<div style=\"background:#F7D6E8;position:relative;overflow:hidden;min-height:74vh;display:flex;align-items:flex-end\">\n  <div style=\"position:absolute;right:-3vw;top:-6vw;font-family:'Anton',sans-serif;font-size:clamp(260px,38vw,600px);line-height:1;color:transparent;-webkit-text-stroke:2px rgba(155,0,85,.16);pointer-events:none;user-select:none\">06<\u002Fdiv>\n  <div style=\"width:100%;max-width:1400px;margin:0 auto;padding:110px 6vw 9vh 6vw;position:relative\">\n    <div style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#9B0055;margin-bottom:28px\">06 / 10 — Art Direction &amp; AI Approach<\u002Fdiv>\n    <h2 style=\"margin:0;line-height:.94\">\n      <span style=\"display:block;font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(40px,6.6vw,108px);color:#2B2A2A\">Beautiful enough to<\u002Fspan>\n      <span style=\"display:block;font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(40px,6.6vw,108px);color:#2B2A2A\">feel like <em style=\"font-family:'Instrument Serif',serif;font-style:italic;text-transform:none;font-weight:400;font-size:1.18em;color:#DD007A\">Very.<\u002Fem><\u002Fspan>\n    <\u002Fh2>\n  <\u002Fdiv>\n<\u002Fdiv>\n<svg sc-camel-view-box=\"0 0 1440 70\" sc-camel-preserve-aspect-ratio=\"none\" style=\"display:block;width:100%;height:70px\"><path d=\"M0 0 L1440 0 L1440 14 C1050 78 390 78 0 14 Z\" fill=\"#F7D6E8\"><\u002Fpath><\u002Fsvg>\n\n<div style=\"max-width:1400px;margin:90px auto 0 auto;padding:0 6vw;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(40px,7vw,110px);align-items:start\">\n  <div data-reveal=\"1\">\n    <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#faf1f6,#faf1f6 14px,#f3e3ec 14px,#f3e3ec 28px);border:1px dashed #d9a8c6;aspect-ratio:16/9\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#a8517f;background:rgba(255,255,255,.9);padding:9px 16px;text-transform:uppercase;text-align:center\">Image — Art direction board: the five worlds<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;margin-top:22px\">\n      <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#faf1f6,#faf1f6 14px,#f3e3ec 14px,#f3e3ec 28px);border:1px dashed #d9a8c6;aspect-ratio:16/9\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#a8517f;background:rgba(255,255,255,.9);padding:9px 16px;text-transform:uppercase;text-align:center\">Image — Palette &amp; texture per world<\u002Fspan><\u002Fdiv>\n      <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#faf1f6,#faf1f6 14px,#f3e3ec 14px,#f3e3ec 28px);border:1px dashed #d9a8c6;aspect-ratio:16/9\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#a8517f;background:rgba(255,255,255,.9);padding:9px 16px;text-transform:uppercase;text-align:center\">Image — Product detail: the Very box<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div data-reveal=\"1\">\n    <p style=\"margin:0 0 34px 0;line-height:1.08\"><span style=\"font-family:'Anton',sans-serif;text-transform:uppercase;letter-spacing:.01em;font-size:clamp(24px,2.6vw,38px);color:#2B2A2A\">Every world should be carefully designed with its own visual identity, <\u002Fspan><em style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(27px,3vw,44px);color:#DD007A\">while maintaining a coherent visual language across the film.<\u002Fem><\u002Fp>\n    <div style=\"border-bottom:1px solid #EBD5E2;margin:0 0 30px 0\">\n      <div style=\"display:flex;align-items:baseline;gap:clamp(12px,1.6vw,22px);border-top:1px solid #EBD5E2;padding:clamp(10px,1.2vw,16px) 0\">\n        <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:11px;letter-spacing:.14em;color:#DD007A;flex:0 0 auto\">01<\u002Fspan>\n        <span style=\"font-family:'Anton',sans-serif;text-transform:uppercase;letter-spacing:.01em;font-size:clamp(18px,1.7vw,24px);color:#2B2A2A;line-height:1;flex:1 1 auto\">The Flock's Home<\u002Fspan>\n        <span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(15px,1.4vw,20px);color:#DD007A;flex:0 0 auto;text-align:right\">tactile and warm<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:clamp(12px,1.6vw,22px);border-top:1px solid #EBD5E2;padding:clamp(10px,1.2vw,16px) 0\">\n        <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:11px;letter-spacing:.14em;color:#DD007A;flex:0 0 auto\">02<\u002Fspan>\n        <span style=\"font-family:'Anton',sans-serif;text-transform:uppercase;letter-spacing:.01em;font-size:clamp(18px,1.7vw,24px);color:#2B2A2A;line-height:1;flex:1 1 auto\">The Mountains<\u002Fspan>\n        <span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(15px,1.4vw,20px);color:#DD007A;flex:0 0 auto;text-align:right\">expansive and epic<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:clamp(12px,1.6vw,22px);border-top:1px solid #EBD5E2;padding:clamp(10px,1.2vw,16px) 0\">\n        <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:11px;letter-spacing:.14em;color:#DD007A;flex:0 0 auto\">03<\u002Fspan>\n        <span style=\"font-family:'Anton',sans-serif;text-transform:uppercase;letter-spacing:.01em;font-size:clamp(18px,1.7vw,24px);color:#2B2A2A;line-height:1;flex:1 1 auto\">Vietnam Coffee Fields<\u002Fspan>\n        <span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(15px,1.4vw,20px);color:#DD007A;flex:0 0 auto;text-align:right\">lush and verdant<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:clamp(12px,1.6vw,22px);border-top:1px solid #EBD5E2;padding:clamp(10px,1.2vw,16px) 0\">\n        <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:11px;letter-spacing:.14em;color:#DD007A;flex:0 0 auto\">04<\u002Fspan>\n        <span style=\"font-family:'Anton',sans-serif;text-transform:uppercase;letter-spacing:.01em;font-size:clamp(18px,1.7vw,24px);color:#2B2A2A;line-height:1;flex:1 1 auto\">The Spa<\u002Fspan>\n        <span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(15px,1.4vw,20px);color:#DD007A;flex:0 0 auto;text-align:right\">rich and enveloping<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:clamp(12px,1.6vw,22px);border-top:1px solid #EBD5E2;padding:clamp(10px,1.2vw,16px) 0\">\n        <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:11px;letter-spacing:.14em;color:#DD007A;flex:0 0 auto\">05<\u002Fspan>\n        <span style=\"font-family:'Anton',sans-serif;text-transform:uppercase;letter-spacing:.01em;font-size:clamp(18px,1.7vw,24px);color:#2B2A2A;line-height:1;flex:1 1 auto\">Space<\u002Fspan>\n        <span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(15px,1.4vw,20px);color:#DD007A;flex:0 0 auto;text-align:right\">clean, luminous and vast<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"max-width:1400px;margin:90px auto 0 auto;padding:0 6vw\" data-reveal=\"1\">\n  <p style=\"margin:0;font-weight:300;font-size:clamp(15px,1.6vw,23px);line-height:1.7;max-width:52em\">Very is known for beautifully crafted storytelling and imagery, and I want to build on that with a world that feels rich enough to explore. From the smallest details in the family home to the products themselves, everything should feel <em style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:1.15em;color:#DD007A\">considered and beautifully integrated into the story<\u002Fem>, rather than simply placed within it. The Very boxes in particular should feel like part of this world from the very beginning, becoming a natural visual thread throughout Eddie's adventure.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"max-width:1400px;margin:90px auto 0 auto;padding:0 6vw\" data-reveal=\"1\">\n  <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,2.4vw,26px);margin-bottom:clamp(28px,3.4vw,44px)\">\n    <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#faf1f6,#faf1f6 14px,#f3e3ec 14px,#f3e3ec 28px);border:1px dashed #d9a8c6;aspect-ratio:16/9\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#a8517f;background:rgba(255,255,255,.9);padding:9px 16px;text-transform:uppercase;text-align:center\">Image — AI explorations: compositions &amp; lighting<\u002Fspan><\u002Fdiv>\n    <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#faf1f6,#faf1f6 14px,#f3e3ec 14px,#f3e3ec 28px);border:1px dashed #d9a8c6;aspect-ratio:16/9\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#a8517f;background:rgba(255,255,255,.9);padding:9px 16px;text-transform:uppercase;text-align:center\">Image — Character consistency tests<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(40px,6vw,90px)\">\n    <p style=\"margin:0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.7\">AI gives us the freedom to explore these worlds quickly and extensively, experimenting with descriptions, references, compositions and lighting until we find the right visual language. This allows us to spend more time refining <em style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:1.15em;color:#DD007A\">the details that matter<\u002Fem>, from character performance and expression to the environments and the way they interact with the products, while maintaining a consistent look across the film.<\u002Fp>\n    <p style=\"margin:0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.7\">And consistency in character will be as important as the spectacle: beautifully resolved characters, rich environments, sophisticated lighting and product detail, all feeling as though they belong to <em style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:1.15em;color:#DD007A\">one premium animated film<\u002Fem>.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n<div style=\"height:150px\"><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ========== 07 CAMERA & LIGHTING ========== -->\n<section id=\"camera\" data-screen-label=\"Camera &amp; Lighting\">\n<div style=\"background:#2B2A2A;position:relative;overflow:hidden;min-height:74vh;display:flex;align-items:flex-end\">\n  <div style=\"position:absolute;right:-3vw;top:-6vw;font-family:'Anton',sans-serif;font-size:clamp(260px,38vw,600px);line-height:1;color:transparent;-webkit-text-stroke:2px rgba(221,0,122,.28);pointer-events:none;user-select:none\">07<\u002Fdiv>\n  <div style=\"width:100%;max-width:1400px;margin:0 auto;padding:110px 6vw 9vh 6vw;position:relative\">\n    <div style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#F7A9D2;margin-bottom:28px\">07 / 10 — Camera &amp; Lighting<\u002Fdiv>\n    <h2 style=\"margin:0;line-height:.94\">\n      <span style=\"display:block;font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(40px,6.6vw,108px);color:#FFFFFF\">Always moving towards<\u002Fspan>\n      <span style=\"display:block;font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(40px,6.6vw,108px);color:#FFFFFF\">the next <em style=\"font-family:'Instrument Serif',serif;font-style:italic;text-transform:none;font-weight:400;font-size:1.18em;color:#DD007A\">wonder.<\u002Fem><\u002Fspan>\n    <\u002Fh2>\n  <\u002Fdiv>\n<\u002Fdiv>\n<svg sc-camel-view-box=\"0 0 1440 70\" sc-camel-preserve-aspect-ratio=\"none\" style=\"display:block;width:100%;height:70px\"><path d=\"M0 0 L1440 0 L1440 14 C1050 78 390 78 0 14 Z\" fill=\"#2B2A2A\"><\u002Fpath><\u002Fsvg>\n\n<div style=\"max-width:1400px;margin:90px auto 0 auto;padding:0 6vw\" data-reveal=\"1\">\n  <p style=\"margin:0;line-height:1.08\"><span style=\"font-family:'Anton',sans-serif;text-transform:uppercase;letter-spacing:.01em;font-size:clamp(30px,3.6vw,54px);color:#2B2A2A\">The camera should feel <\u002Fspan><em style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(34px,4.1vw,62px);color:#DD007A\">as curious as Eddie.<\u002Fem><\u002Fp>\n  <p style=\"margin:32px 0 0 0;font-weight:300;font-size:clamp(15px,1.6vw,23px);line-height:1.7;max-width:52em\">We begin close and intimate in the Christmas morning world, capturing that sense of possibility and excitement before we reveal the scale of each new environment. Even as the worlds become increasingly spectacular, the characters and products remain at the heart of the frame, allowing us to experience the joy these gifts bring.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"max-width:1400px;margin:80px auto 0 auto;padding:0 6vw\">\n  <div style=\"margin-bottom:80px\" data-reveal=\"1\">\n    <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#faf1f6,#faf1f6 14px,#f3e3ec 14px,#f3e3ec 28px);border:1px dashed #d9a8c6;aspect-ratio:21/9\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#a8517f;background:rgba(255,255,255,.9);padding:9px 16px;text-transform:uppercase;text-align:center\">Image/GIF — Widescreen frame: light study across the five worlds<\u002Fspan><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 1fr;gap:22px;margin-top:22px\">\n      <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#faf1f6,#faf1f6 14px,#f3e3ec 14px,#f3e3ec 28px);border:1px dashed #d9a8c6;aspect-ratio:16/9\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#a8517f;background:rgba(255,255,255,.9);padding:9px 16px;text-transform:uppercase;text-align:center\">Image — Home: warm practicals<\u002Fspan><\u002Fdiv>\n      <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#faf1f6,#faf1f6 14px,#f3e3ec 14px,#f3e3ec 28px);border:1px dashed #d9a8c6;aspect-ratio:16/9\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#a8517f;background:rgba(255,255,255,.9);padding:9px 16px;text-transform:uppercase;text-align:center\">Image — Mountains: cool &amp; crisp<\u002Fspan><\u002Fdiv>\n      <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#faf1f6,#faf1f6 14px,#f3e3ec 14px,#f3e3ec 28px);border:1px dashed #d9a8c6;aspect-ratio:16/9\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#a8517f;background:rgba(255,255,255,.9);padding:9px 16px;text-transform:uppercase;text-align:center\">Image — Space: lit by stars<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,4vw,64px);align-items:start\" data-reveal=\"1\">\n    <p style=\"margin:0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.7\">Lighting will help give each world an identity. Warm practical Christmas light establishes home, cooler light enhances the crispness of the mountains, rich sunlight and greenery bring warmth to the coffee fields, soft diffused light envelops the spa, and <em style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:1.15em;color:#DD007A\">the stars themselves become the source of light<\u002Fem> in Eddie's final world.<\u002Fp>\n    <div>\n      <p style=\"margin:0 0 28px 0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.7\">The Very box itself will remain a consistent colour, while the highlights and reflections around it respond naturally to each environment. This allows the box to feel integrated into every world while retaining the distinctive Very branding throughout.<\u002Fp>\n      <p style=\"margin:0;font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(24px,2.4vw,34px);line-height:1.25;color:#DD007A\">The box stays Very pink, in every world.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,4vw,64px);margin-top:44px\" data-reveal=\"1\">\n    <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#faf1f6,#faf1f6 14px,#f3e3ec 14px,#f3e3ec 28px);border:1px dashed #d9a8c6;aspect-ratio:16/9\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#a8517f;background:rgba(255,255,255,.9);padding:9px 16px;text-transform:uppercase;text-align:center\">Image — Lighting keys: home, mountains, spa, space<\u002Fspan><\u002Fdiv>\n    <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#faf1f6,#faf1f6 14px,#f3e3ec 14px,#f3e3ec 28px);border:1px dashed #d9a8c6;aspect-ratio:16/9\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#a8517f;background:rgba(255,255,255,.9);padding:9px 16px;text-transform:uppercase;text-align:center\">Image — The Very box across the five lighting worlds<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<div style=\"height:150px\"><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ========== 08 EDITING ========== -->\n<section id=\"editing\" data-screen-label=\"Editing\">\n<div style=\"background:#9B0055;position:relative;overflow:hidden;min-height:74vh;display:flex;align-items:flex-end\">\n  <div style=\"position:absolute;right:-3vw;top:-6vw;font-family:'Anton',sans-serif;font-size:clamp(260px,38vw,600px);line-height:1;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.14);pointer-events:none;user-select:none\">08<\u002Fdiv>\n  <div style=\"width:100%;max-width:1400px;margin:0 auto;padding:110px 6vw 9vh 6vw;position:relative\">\n    <div style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#F7A9D2;margin-bottom:28px\">08 / 10 — Editing<\u002Fdiv>\n    <h2 style=\"margin:0;line-height:.94\">\n      <span style=\"display:block;font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(40px,6.6vw,108px);color:#FFFFFF\">Keep the adventure moving.<\u002Fspan>\n      <span style=\"display:block;font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(40px,6.6vw,108px);color:#FFFFFF\">Let the wonder <em style=\"font-family:'Instrument Serif',serif;font-style:italic;text-transform:none;font-weight:400;font-size:1.18em;color:#F7A9D2\">breathe.<\u002Fem><\u002Fspan>\n    <\u002Fh2>\n  <\u002Fdiv>\n<\u002Fdiv>\n<svg sc-camel-view-box=\"0 0 1440 70\" sc-camel-preserve-aspect-ratio=\"none\" style=\"display:block;width:100%;height:70px\"><path d=\"M0 0 L1440 0 L1440 14 C1050 78 390 78 0 14 Z\" fill=\"#9B0055\"><\u002Fpath><\u002Fsvg>\n\n<div style=\"max-width:1400px;margin:80px auto 0 auto;padding:0 6vw;display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(40px,6vw,90px);align-items:end\" data-reveal=\"1\">\n  <p style=\"margin:0;line-height:1.1\"><span style=\"font-family:'Anton',sans-serif;text-transform:uppercase;letter-spacing:.01em;font-size:clamp(26px,3.4vw,54px);color:#2B2A2A\">A lot of story in <\u002Fspan><span style=\"font-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(34px,4.6vw,74px);color:#DD007A\">30 seconds.<\u002Fspan><\u002Fp>\n  <p style=\"margin:0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.7\">There is a lot of story packed into 30 seconds, so the edit needs to be <em style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:1.15em;color:#DD007A\">confident and economical<\u002Fem> without ever feeling rushed.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"max-width:1400px;margin:44px auto 0 auto;padding:0 6vw;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px\" data-reveal=\"1\">\n  <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#faf1f6,#faf1f6 14px,#f3e3ec 14px,#f3e3ec 28px);border:1px dashed #d9a8c6;aspect-ratio:4/5\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#a8517f;background:rgba(255,255,255,.9);padding:9px 16px;text-transform:uppercase;text-align:center;font-size:10px;padding:6px 8px\">Cut 01 — the first box<\u002Fspan><\u002Fdiv>\n  <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#faf1f6,#faf1f6 14px,#f3e3ec 14px,#f3e3ec 28px);border:1px dashed #d9a8c6;aspect-ratio:4/5\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#a8517f;background:rgba(255,255,255,.9);padding:9px 16px;text-transform:uppercase;text-align:center;font-size:10px;padding:6px 8px\">Cut 02 — the mountain<\u002Fspan><\u002Fdiv>\n  <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#faf1f6,#faf1f6 14px,#f3e3ec 14px,#f3e3ec 28px);border:1px dashed #d9a8c6;aspect-ratio:4/5\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#a8517f;background:rgba(255,255,255,.9);padding:9px 16px;text-transform:uppercase;text-align:center;font-size:10px;padding:6px 8px\">Cut 03 — the coffee<\u002Fspan><\u002Fdiv>\n  <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#faf1f6,#faf1f6 14px,#f3e3ec 14px,#f3e3ec 28px);border:1px dashed #d9a8c6;aspect-ratio:4/5\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#a8517f;background:rgba(255,255,255,.9);padding:9px 16px;text-transform:uppercase;text-align:center;font-size:10px;padding:6px 8px\">Cut 04 — the spa<\u002Fspan><\u002Fdiv>\n  <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#faf1f6,#faf1f6 14px,#f3e3ec 14px,#f3e3ec 28px);border:1px dashed #d9a8c6;aspect-ratio:4/5\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#a8517f;background:rgba(255,255,255,.9);padding:9px 16px;text-transform:uppercase;text-align:center;font-size:10px;padding:6px 8px\">Cut 05 — the stars<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"max-width:1400px;margin:22px auto 0 auto;padding:0 6vw;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(40px,6vw,90px)\" data-reveal=\"1\">\n  <p style=\"margin:0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.7\">We'll get Eddie into the first box quickly, then give each world one or two strong character moments that tell us everything we need to know. The transitions become part of the rhythm, constantly carrying us forward towards <em style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:1.15em;color:#DD007A\">the next discovery<\u002Fem>.<\u002Fp>\n  <p style=\"margin:0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.7\">The transition home will be particularly important. Rather than simply cutting back to the living room, I want <em style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:1.15em;color:#DD007A\">the fairy lights to emerge naturally from the stars<\u002Fem>, allowing Eddie's imagination to become the bridge between the two worlds.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"width:100vw;margin:clamp(56px,7vw,96px) 0 0 calc(50% - 50vw);position:relative;background:#191419\" data-reveal=\"1\">\n  <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#221C26,#221C26 14px,#2A2330 14px,#2A2330 28px);aspect-ratio:21/9\">\n    <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#E9A8CC;background:rgba(20,16,22,.75);padding:9px 16px;text-transform:uppercase;text-align:center\">Image/GIF — Full-bleed: the Milky Way, where the pace opens up<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"max-width:1400px;margin:0 auto;padding:clamp(40px,5vw,72px) 6vw\">\n    <p style=\"margin:0;line-height:1.14;text-wrap:pretty\"><span style=\"font-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(22px,2.4vw,36px);color:#FFFFFF\">Then, when we reach space, we deliberately let the pace open up. <\u002Fspan><em style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(26px,2.9vw,44px);color:#F7A9D2\">The Milky Way is where the audience should feel the scale of Eddie's adventure, rather than simply register another visual.<\u002Fem><\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n<div style=\"height:150px\"><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ========== 09 SOUND & MUSIC ========== -->\n<section id=\"sound\" data-screen-label=\"Sound &amp; Music\">\n<div style=\"background:#DD007A;position:relative;overflow:hidden;min-height:74vh;display:flex;align-items:flex-end\">\n  <div style=\"position:absolute;right:-3vw;top:-6vw;font-family:'Anton',sans-serif;font-size:clamp(260px,38vw,600px);line-height:1;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.18);pointer-events:none;user-select:none\">09<\u002Fdiv>\n  <div style=\"width:100%;max-width:1400px;margin:0 auto;padding:110px 6vw 9vh 6vw;position:relative\">\n    <div style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.85);margin-bottom:28px\">09 / 10 — Sound &amp; Music<\u002Fdiv>\n    <h2 style=\"margin:0;line-height:.94\">\n      <span style=\"display:block;font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(40px,6.6vw,108px);color:#FFFFFF\">A world you can <em style=\"font-family:'Instrument Serif',serif;font-style:italic;text-transform:none;font-weight:400;font-size:1.18em;color:#2B2A2A\">hear<\u002Fem><\u002Fspan>\n      <span style=\"display:block;font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(40px,6.6vw,108px);color:#FFFFFF\">as well as see.<\u002Fspan>\n    <\u002Fh2>\n  <\u002Fdiv>\n<\u002Fdiv>\n<svg sc-camel-view-box=\"0 0 1440 70\" sc-camel-preserve-aspect-ratio=\"none\" style=\"display:block;width:100%;height:70px\"><path d=\"M0 0 L1440 0 L1440 14 C1050 78 390 78 0 14 Z\" fill=\"#DD007A\"><\u002Fpath><\u002Fsvg>\n\n<div style=\"max-width:1400px;margin:80px auto 0 auto;padding:0 6vw\" data-reveal=\"1\">\n  <p style=\"margin:0;line-height:1.12;text-wrap:balance\"><span style=\"font-family:'Anton',sans-serif;text-transform:uppercase;letter-spacing:.01em;font-size:clamp(26px,3.2vw,50px);color:#2B2A2A\">Music should give the film a playful sense of <\u002Fspan><em style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(30px,3.7vw,58px);color:#DD007A\">momentum and discovery.<\u002Fem><\u002Fp>\n<\u002Fdiv>\n\n<div style=\"max-width:1400px;margin:44px auto 0 auto;padding:0 6vw;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(40px,6vw,90px)\" data-reveal=\"1\">\n  <p style=\"margin:0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.7\">Building with Eddie's journey without becoming overly sentimental or traditionally festive. It should feel contemporary and cinematic, with enough warmth to carry the emotion while <em style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:1.15em;color:#DD007A\">leaving space for the sound design to tell its own story<\u002Fem>.<\u002Fp>\n  <p style=\"margin:0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.7\">Sound design will give each world its own personality, helping us make these fantastical environments feel tangible and alive — the vortex, the comical <em style=\"font-family:'Anton',sans-serif;font-style:normal;text-transform:uppercase;font-size:1.2em;color:#DD007A\">CRUNCH<\u002Fem> of cardboard, beans being prepared, the ambience of the spa, the weightlessness of space.<\u002Fp>\n<\u002Fdiv>\n\n<div style=\"width:100vw;margin:clamp(56px,7vw,96px) 0 0 calc(50% - 50vw);background:#191419;padding:clamp(48px,6vw,84px) 0 clamp(40px,5vw,72px) 0;overflow:hidden\" data-reveal=\"1\">\n  <div style=\"max-width:1400px;margin:0 auto;padding:0 6vw\">\n    <div style=\"display:flex;align-items:flex-end;gap:clamp(2px,.5vw,6px);height:clamp(150px,20vw,260px)\"><span style=\"flex:1;height:18%;min-width:2px;background:#DD007A;transform-origin:50% 100%;animation:eqbar 2.40s ease-in-out 0.00s infinite;opacity:.95\"><\u002Fspan><span style=\"flex:1;height:24%;min-width:2px;background:#E9358F;transform-origin:50% 100%;animation:eqbar 2.68s ease-in-out 0.22s infinite;opacity:.75\"><\u002Fspan><span style=\"flex:1;height:21%;min-width:2px;background:#F26BA8;transform-origin:50% 100%;animation:eqbar 2.96s ease-in-out 0.44s infinite;opacity:.75\"><\u002Fspan><span style=\"flex:1;height:27%;min-width:2px;background:#C2006B;transform-origin:50% 100%;animation:eqbar 3.24s ease-in-out 0.66s infinite;opacity:.95\"><\u002Fspan><span style=\"flex:1;height:24%;min-width:2px;background:#F7A9D2;transform-origin:50% 100%;animation:eqbar 3.52s ease-in-out 0.88s infinite;opacity:.75\"><\u002Fspan><span style=\"flex:1;height:30%;min-width:2px;background:#A80059;transform-origin:50% 100%;animation:eqbar 3.80s ease-in-out 1.10s infinite;opacity:.75\"><\u002Fspan><span style=\"flex:1;height:27%;min-width:2px;background:#DD007A;transform-origin:50% 100%;animation:eqbar 4.08s ease-in-out 1.32s infinite;opacity:.95\"><\u002Fspan><span style=\"flex:1;height:33%;min-width:2px;background:#E9358F;transform-origin:50% 100%;animation:eqbar 2.40s ease-in-out 1.54s infinite;opacity:.75\"><\u002Fspan><span style=\"flex:1;height:30%;min-width:2px;background:#F26BA8;tran nt-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(15px,1.5vw,21px);color:#FFFFFF;line-height:1.1\">The Spa<\u002Fdiv><p style=\"margin:7px 0 0 0;font-weight:300;font-size:clamp(13px,1.1vw,15px);line-height:1.55;color:rgba(237,230,236,.8)\">A space for tranquility<\u002Fp><\u002Fdiv>\n    <div style=\"border-top:1px solid rgba(247,169,210,.35);padding-top:14px\"><div style=\"font-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(15px,1.5vw,21px);color:#FFFFFF;line-height:1.1\">Space<\u002Fdiv><p style=\"margin:7px 0 0 0;font-weight:300;font-size:clamp(13px,1.1vw,15px);line-height:1.55;color:rgba(237,230,236,.8)\">The edge of the world<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"max-width:1400px;margin:clamp(56px,7vw,96px) auto 0 auto;padding:0 6vw;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(40px,6vw,90px);align-items:center\" data-reveal=\"1\">\n  <p style=\"margin:0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.7\">Sound should help us experience Eddie's journey with him, building anticipation as each box opens, punctuating the comedy and then <em style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:1.15em;color:#DD007A\">giving us space to breathe when he reaches the stars<\u002Fem>. Used alongside the music, it becomes another layer of storytelling that can make the magic feel real without ever overpowering the picture.<\u002Fp>\n  <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#faf1f6,#faf1f6 14px,#f3e3ec 14px,#f3e3ec 28px);border:1px dashed #d9a8c6;aspect-ratio:16/9\">\n    <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#a8517f;background:rgba(255,255,255,.9);padding:9px 16px;text-transform:uppercase;text-align:center\">Image/GIF — Anticipation: each box opens<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n<div style=\"height:150px\"><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ========== 10 FINALLY ========== -->\n<section id=\"finally\" data-screen-label=\"Finally\">\n<div style=\"background:#F7D6E8;position:relative;overflow:hidden;min-height:74vh;display:flex;align-items:flex-end\">\n  <div style=\"position:absolute;right:-3vw;top:-6vw;font-family:'Anton',sans-serif;font-size:clamp(260px,38vw,600px);line-height:1;color:transparent;-webkit-text-stroke:2px rgba(155,0,85,.16);pointer-events:none;user-select:none\">10<\u002Fdiv>\n  <div style=\"width:100%;max-width:1400px;margin:0 auto;padding:110px 6vw 9vh 6vw;position:relative\">\n    <div style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#9B0055;margin-bottom:28px\">10 / 10 — Finally<\u002Fdiv>\n    <h2 style=\"margin:0;line-height:.96\">\n      <span style=\"display:block;font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(34px,5.4vw,88px);color:#2B2A2A\">Sometimes the best gifts<\u002Fspan>\n      <span style=\"display:block;font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(34px,5.4vw,88px);color:#2B2A2A\">take you somewhere you<\u002Fspan>\n      <span style=\"display:block;font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:clamp(44px,7vw,116px);color:#DD007A\">never expected.<\u002Fspan>\n    <\u002Fh2>\n  <\u002Fdiv>\n<\u002Fdiv>\n<svg sc-camel-view-box=\"0 0 1440 70\" sc-camel-preserve-aspect-ratio=\"none\" style=\"display:block;width:100%;height:70px\"><path d=\"M0 0 L1440 0 L1440 14 C1050 78 390 78 0 14 Z\" fill=\"#F7D6E8\"><\u002Fpath><\u002Fsvg>\n\n<div style=\"max-width:1400px;margin:80px auto 0 auto;padding:0 6vw;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(40px,6vw,90px);align-items:center\" data-reveal=\"1\">\n  <div style=\"position:relative;display:flex;align-items:center;justi => this.syncBoxAnimations(), 1500);\n    const m = document.querySelector('[data-marquee]');\n    if (m) {\n      let x = 0;\n      const step = () => {\n        x -= 0.32;\n        if (-x >= m.scrollWidth / 2) x = 0;\n        m.style.transform = 'translateX(' + x + 'px)';\n        this._raf = requestAnimationFrame(step);\n      };\n      this._raf = requestAnimationFrame(step);\n    }\n  }\n  initCarousel() {\n    const track = document.querySelector('[data-marquee-carousel]');\n    if (!track || track._wired) return;\n    track._wired = true;\n    const run = track.querySelector('[data-mc-run]');\n    let x = 0, paused = false;\n    track.addEventListener('mouseenter', () => { paused = true; });\n    track.addEventListener('mouseleave', () => { paused = false; });\n    const step = () => {\n      if (!paused) {\n        x -= 0.55;\n        const w = run.getBoundingClientRect().width;\n        if (w && -x >= w) x += w;\n        track.style.transform = 'translateX(' + x + 'px)';\n      }\n      this._mcRaf = requestAnimationFrame(step);\n    };\n    this._mcRaf = requestAnimationFrame(step);\n  }\n  syncBoxAnimations() {\n    const anims = document.getAnimations().filter(a => a.animationName && a.animationName.indexOf('vb-') === 0);\n    if (!anims.length) return;\n    const t = anims[0].startTime;\n    anims.forEach(a => { if (a.startTime !== t) a.startTime = t; });\n  }\n  componentWillUnmount() {\n    if (this._io) this._io.disconnect();\n    if (this._raf) cancelAnimationFrame(this._raf);\n    if (this._sync) clearInterval(this._sync);\n    if (this._mcRaf) cancelAnimationFrame(this._mcRaf);\n  }\n  renderVals() {\n    return {};\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
