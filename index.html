    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }

  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

0}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<!-- ========== COVER / 01 INTRO ========== -->\n<section id=\"intro\" data-screen-label=\"Cover / Intro\">\n<div style=\"background:#DD007A;position:relative;overflow:hidden;min-height:100vh;display:flex;flex-direction:column;justify-content:space-between\">\n  <div style=\"position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);width:70vw;height:70vw;background:radial-gradient(circle,rgba(255,255,255,.25) 0%,rgba(255,255,255,0) 60%);pointer-events:none\"><\u002Fdiv>\n  <div style=\"display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;padding:34px 6vw;position:relative\">\n    <div style=\"font-family:'Anton',sans-serif;font-size:14px;letter-spacing:.24em;text-transform:uppercase;color:#FFFFFF\">Very — That's the Very Thing<\u002Fdiv>\n    <div style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#2B2A2A\">Director's treatment · Peter Lee Scott<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"padding:0 6vw 8vh 6vw;position:relative\">\n    <h1 style=\"margin:0;line-height:.92\">\n      <span style=\"display:block;font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(44px,7.6vw,124px);color:#FFFFFF\">Let's make Christmas<\u002Fspan>\n      <span style=\"display:block;font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(44px,7.6vw,124px);color:transparent;-webkit-text-stroke:2px #FFFFFF\">feel like an<\u002Fspan>\n      <span style=\"display:block;font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:clamp(64px,11.5vw,188px);color:#2B2A2A;margin:1vh 0\">adventure<\u002Fspan>\n      <span style=\"display:block;font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(44px,7.6vw,124px);color:#FFFFFF\">again.<\u002Fspan>\n    <\u002Fh1>\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-top:6vh\">\n      <div style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.85)\">01 / 10 — Intro<\u002Fdiv>\n      <div style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.85)\">Scroll ↓<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<svg sc-camel-view-box=\"0 0 1440 70\" sc-camel-preserve-aspect-ratio=\"none\" style=\"display:block;width:100%;height:70px\"><path d=\"M0 0 L1440 0 L1440 14 C1050 78 390 78 0 14 Z\" fill=\"#DD007A\"><\u002Fpath><\u002Fsvg>\n\n<div style=\"max-width:1400px;margin:110px auto 0 auto;padding:0 6vw\" data-reveal=\"1\">\n  <p style=\"margin:0;line-height:1.1;text-wrap:balance;max-width:1400px\"><span style=\"font-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(32px,4.6vw,72px);color:#2B2A2A\">There is something wonderfully uninhibited <\u002Fspan><span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(36px,5.2vw,82px);color:#DD007A\">about the way children experience Christmas.<\u002Fspan><\u002Fp>\n<\u002Fdiv>\n\n<div style=\"width:100vw;margin:56px 0 0 calc(50% - 50vw);position:relative\" data-reveal=\"1\">\n  <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#faf1f6,#faf1f6 14px,#f3e3ec 14px,#f3e3ec 28px);border:1px dashed #d9a8c6;aspect-ratio:21/9\">\n    <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#a8517f;background:rgba(255,255,255,.9);padding:9px 16px;text-transform:uppercase;text-align:center\">Image/GIF — Christmas morning: Eddie alone with the tree<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"max-width:1400px;margin:64px auto 0 auto;padding:0 6vw;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(40px,6vw,90px);align-items:center\" data-reveal=\"1\">\n  <div>\n    <div style=\"display:flex;flex-direction:column;gap:10px\">\n      <span style=\"font-weight:300;font-size:clamp(17px,1.5vw,21px);color:#3D3C3C\">A present isn't just a present.<\u002Fspan>\n      <span style=\"font-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(30px,3.6vw,54px);color:#DD007A;letter-spacing:.02em;line-height:1\">It could be anything.<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"margin:36px 0 0 0;font-weight:300;font-size:clamp(17px,1.5vw,21px);line-height:1.6\">And for Eddie, one curious peek inside a Very box can take him somewhere <em style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:1.2em;color:#DD007A\">far beyond the living room<\u002Fem>.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px\">\n    <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#faf1f6,#faf1f6 14px,#f3e3ec 14px,#f3e3ec 28px);border:1px dashed #d9a8c6;aspect-ratio:4/5\">\n      <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#a8517f;background:rgba(255,255,255,.9);padding:9px 16px;text-transform:uppercase;text-align:center\">Image — The glowing Very box<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#faf1f6,#faf1f6 14px,#f3e3ec 14px,#f3e3ec 28px);border:1px dashed #d9a8c6;aspect-ratio:4/5;margin-top:36px\">\n      <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#a8517f;background:rgba(255,255,255,.9);padding:9px 16px;text-transform:uppercase;text-align:center\">Image — Eddie's face, lit pink<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"max-width:1400px;margin:110px auto 0 auto;padding:0 6vw;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,4vw,64px);align-items:start\">\n  <div data-reveal=\"1\">\n    <p style=\"margin:0 0 26px 0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.7\">I want to embrace that sense of possibility and make the film feel like a beautifully crafted Christmas adventure: warm and human at its heart, but with a heightened visual world where anything can happen. The comedy should come from the situations and unexpected details, while the visual ambition keeps building until Eddie reaches a moment of <em style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:1.15em;color:#DD007A\">genuine awe<\u002Fem>.<\u002Fp>\n    <p style=\"margin:0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.7\">And importantly, the family, their reactions and the relationships between them should always give us an emotional anchor while everything around them becomes increasingly extraordinary. That balance of <em style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:1.15em;color:#DD007A\">the familiar and the impossible<\u002Fem> is where I think we can find <em style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:1.15em;color:#DD007A\">the real magic of the film<\u002Fem>, creating something that feels as joyful and charming as Christmas itself.<\u002Fp>\n  <\u002Fdiv>\n  <div data-reveal=\"1\">\n    <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#faf1f6,#faf1f6 14px,#f3e3ec 14px,#f3e3ec 28px);border:1px dashed #d9a8c6;aspect-ratio:16/9\"><img src=\"40fa0f0d-f741-4229-b3ef-13f94f5b7944\" alt=\"a9507358-7156-48f7-91de-3ccee7b09276_xs\" width=\"854\" height=\"320\" style=\"max-width: 100%; height: auto; display: block; object-fit: cover; width: 854px; aspect-ratio: 854 / 320\"><\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;margin-top:22px\">\n      <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#faf1f6,#faf1f6 14px,#f3e3ec 14px,#f3e3ec 28px);border:1px dashed #d9a8c6;aspect-ratio:16/9\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#a8517f;background:rgba(255,255,255,.9);padding:9px 16px;text-transform:uppercase;text-align:center\">Image — The living room, before dawn<\u002Fspan><\u002Fdiv>\n      <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#faf1f6,#faf1f6 14px,#f3e3ec 14px,#f3e3ec 28px);border:1px dashed #d9a8c6;aspect-ratio:16/9\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#a8517f;background:rgba(255,255,255,.9);padding:9px 16px;text-transform:uppercase;text-align:center\">Image — The pink glow spills out<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"margin:72px 0 0 0;padding:0 6vw\" data-reveal=\"1\">\n  <p style=\"margin:0 auto;max-width:1400px;line-height:1.1;text-wrap:balance\">\n    <span style=\"font-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(32px,4.6vw,72px);color:#2B2A2A\">Magical, cinematic and full of charm. <\u002Fspan>\n    <span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(36px,5.2vw,82px);color:#DD007A\">With just enough mischief to keep us smiling.<\u002Fspan>\n  <\u002Fp>\n<\u002Fdiv>\n<div style=\"height:80px\"><\u002Fdiv>\n<\u002Fsection>\n\n<!-- ========== 02 APPROACH ========== -->\n<section id=\"approach\" data-screen-label=\"Approach\">\n<div style=\"background:#F7D6E8;position:relative;overflow:hidden;min-height:74vh;display:flex;align-items:flex-end\">\n  <div style=\"position:absolute;right:-3vw;top:-6vw;font-family:'Anton',sans-serif;font-size:clamp(260px,38vw,600px);line-height:1;color:transparent;-webkit-text-stroke:2px rgba(155,0,85,.16);pointer-events:none;user-select:none\">02<\u002Fdiv>\n  <div style=\"width:100%;max-width:1400px;margin:0 auto;padding:110px 6vw 9vh 6vw;position:relative\">\n    <div style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#9B0055;margin-bottom:28px\">02 / 10 — Approach<\u002Fdiv>\n    <h2 style=\"margin:0;line-height:.94\">\n      <span style=\"display:block;font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(40px,6.6vw,108px);color:#2B2A2A\">Make the world feel<\u002Fspan>\n      <span style=\"display:block;font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(40px,6.6vw,108px);color:#2B2A2A\">as big as Eddie's <em style=\"font-family:'Instrument Serif',serif;font-style:italic;text-transform:none;font-weight:400;font-size:1.18em;color:#DD007A\">wonder.<\u002Fem><\u002Fspan>\n    <\u002Fh2>\n  <\u002Fdiv>\n<\u002Fdiv>\n<svg sc-camel-view-box=\"0 0 1440 70\" sc-camel-preserve-aspect-ratio=\"none\" style=\"display:block;width:100%;height:70px\"><path d=\"M0 0 L1440 0 L1440 14 C1050 78 390 78 0 14 Z\" fill=\"#F7D6E8\"><\u002Fpath><\u002Fsvg>\n\n<div style=\"max-width:1400px;margin:80px auto 0 auto;padding:0 6vw\" data-reveal=\"1\">\n  <p style=\"margin:0;line-height:1.06;text-wrap:pretty\"><span style=\"font-family:'Anton',sans-serif;text-transform:uppercase;letter-spacing:.01em;font-size:clamp(30px,4.1vw,66px);color:#2B2A2A\">Each dream gift can feel extraordinary, while their reactions <\u002Fspan><em style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(34px,4.8vw,78px);color:#DD007A\">always feel truthful.<\u002Fem><\u002Fp>\n<\u002Fdiv>\n\n<div style=\"max-width:1400px;margin:clamp(40px,5vw,64px) auto 0 auto;padding:0 6vw\" data-reveal=\"1\">\n  <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(40px,6vw,90px);margin-bottom:clamp(24px,3vw,36px)\">\n  <p style=\"margin:0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.7\">The beauty of animation is that we can make each dream gift feel extraordinary, while keeping the characters grounded enough that their reactions always feel truthful.<\u002Fp>\n  <p style=\"margin:0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.7\">We can build environments that feel spectacular and cinematic, but our camera should always bring us back to the family and Eddie, allowing the audience to experience each discovery through him.<\u002Fp>\n  <\u002Fdiv>\n  <p style=\"margin:0 0 clamp(28px,3.4vw,44px) 0;font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(24px,2.8vw,42px);line-height:1.2;color:#DD007A;text-wrap:pretty\">That gives the film a sense of wonder without losing the human connection at its centre.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(16px,2vw,26px)\">\n    <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#faf1f6,#faf1f6 14px,#f3e3ec 14px,#f3e3ec 28px);border:1px dashed #d9a8c6;aspect-ratio:4/3\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#a8517f;background:rgba(255,255,255,.9);padding:9px 16px;text-transform:uppercase;text-align:center;font-size:11px;padding:7px 10px\">Image — Eddie at the centre of the frame<\u002Fspan><\u002Fdiv>\n    <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#faf1f6,#faf1f6 14px,#f3e3ec 14px,#f3e3ec 28px);border:1px dashed #d9a8c6;aspect-ratio:4/3\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#a8517f;background:rgba(255,255,255,.9);padding:9px 16px;text-transform:uppercase;text-align:center;font-size:11px;padding:7px 10px\">Image — The family, our anchor<\u002Fspan><\u002Fdiv>\n    <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#faf1f6,#faf1f6 14px,#f3e3ec 14px,#f3e3ec 28px);border:1px dashed #d9a8c6;aspect-ratio:4/3\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#a8517f;background:rgba(255,255,255,.9);padding:9px 16px;text-transform:uppercase;text-align:center;font-size:11px;padding:7px 10px\">Image — Discovery, through Eddie's eyes<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"max-width:1400px;margin:clamp(56px,7vw,88px) auto 0 auto;padding:0 6vw;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(40px,6vw,90px);align-items:start\" data-reveal=\"1\">\n  <div>\n    <p style=\"margin:0 0 clamp(24px,2.8vw,36px) 0;line-height:1.08;text-wrap:balance\"><span style=\"font-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(26px,3.1vw,48px);color:#2B2A2A\">I also want to establish a strong <\u002Fspan><span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(30px,3.6vw,56px);color:#DD007A\">visual rhythm<\u002Fspan><span style=\"font-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(26px,3.1vw,48px);color:#2B2A2A\"> across the film.<\u002Fspan><\u002Fp>\n    <p style=\"margin:0 0 22px 0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.7\">Each world should feel completely distinct, with its own atmosphere, colour, texture and energy, but the transitions between them should feel effortless.<\u002Fp>\n    <p style=\"margin:0;font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(22px,2.4vw,34px);line-height:1.22;color:#DD007A\">Distinct, but effortless — every world its own.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"border-bottom:1px solid #EBD5E2\">\n      <div style=\"display:flex;align-items:baseline;gap:clamp(12px,1.6vw,22px);border-top:1px solid #EBD5E2;padding:clamp(12px,1.5vw,20px) 0\">\n        <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:11px;letter-spacing:.14em;color:#DD007A;flex:0 0 auto\">01<\u002Fspan>\n        <span style=\"font-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(22px,2.9vw,44px);color:#2B2A2A;line-height:1;flex:1 1 auto\">Atmosphere<\u002Fspan>\n        <span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(16px,1.6vw,24px);color:#DD007A;flex:0 0 auto;text-align:right\">the air of each world<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:clamp(12px,1.6vw,22px);border-top:1px solid #EBD5E2;padding:clamp(12px,1.5vw,20px) 0\">\n        <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:11px;letter-spacing:.14em;color:#DD007A;flex:0 0 auto\">02<\u002Fspan>\n        <span style=\"font-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(22px,2.9vw,44px);color:#2B2A2A;line-height:1;flex:1 1 auto\">Colour<\u002Fspan>\n        <span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(16px,1.6vw,24px);color:#DD007A;flex:0 0 auto;text-align:right\">its own palette<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:clamp(12px,1.6vw,22px);border-top:1px solid #EBD5E2;padding:clamp(12px,1.5vw,20px) 0\">\n        <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:11px;letter-spacing:.14em;color:#DD007A;flex:0 0 auto\">03<\u002Fspan>\n        <span style=\"font-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(22px,2.9vw,44px);color:#2B2A2A;line-height:1;flex:1 1 auto\">Texture<\u002Fspan>\n        <span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(16px,1.6vw,24px);color:#DD007A;flex:0 0 auto;text-align:right\">what it feels like<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:baseline;gap:clamp(12px,1.6vw,22px);border-top:1px solid #EBD5E2;padding:clamp(12px,1.5vw,20px) 0\">\n        <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:11px;letter-spacing:.14em;color:#DD007A;flex:0 0 auto\">04<\u002Fspan>\n        <span style=\"font-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(22px,2.9vw,44px);color:#2B2A2A;line-height:1;flex:1 1 auto\">Energy<\u002Fspan>\n        <span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(16px,1.6vw,24px);color:#DD007A;flex:0 0 auto;text-align:right\">how fast it moves<\u002Fspan>\n      <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"width:100vw;margin:clamp(48px,6vw,80px) 0 0 calc(50% - 50vw);background:#191419\" data-reveal=\"1\">\n  <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#221C26,#221C26 14px,#2A2330 14px,#2A2330 28px);border:1px dashed #6b4a63;aspect-ratio:21/9\">\n    <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#E9A8CC;background:rgba(20,16,22,.75);padding:9px 16px;text-transform:uppercase;text-align:center\">Image/GIF — Full-bleed: the pink box opens, the glow floods out<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"max-width:1400px;margin:0 auto;padding:clamp(40px,5vw,72px) 6vw\">\n    <p style=\"margin:0;line-height:1.14;text-wrap:pretty\"><span style=\"font-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(22px,2.4vw,36px);color:#FFFFFF\">The audience should never quite know what they're going to find <\u002Fspan><em style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(26px,2.9vw,44px);color:#F7A9D2\">when that pink box opens next.<\u002Fem><\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"max-width:1400px;margin:clamp(56px,7vw,88px) auto 0 auto;padding:0 6vw;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(40px,6vw,90px);align-items:center\" data-reveal=\"1\">\n  <p style=\"margin:0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.7\">The tone is equally important. Rather than being overly sentimental, the warmth should come from <em style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:1.15em;color:#DD007A\">the family<\u002Fem>, the wonder from <em style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:1.15em;color:#DD007A\">Eddie<\u002Fem> and the comedy from <em style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:1.15em;color:#DD007A\">the details<\u002Fem>. That gives us room to make something memorable while still having the lightness and charm that makes Very feel like <em style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:1.2em;color:#DD007A\">Very<\u002Fem>.<\u002Fp>\n  <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#faf1f6,#faf1f6 14px,#f3e3ec 14px,#f3e3ec 28px);border:1px dashed #d9a8c6;aspect-ratio:16/9\">\n    <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#a8517f;background:rgba(255,255,255,.9);padding:9px 16px;text-transform:uppercase;text-align:center\">Image — The family: warmth, wonder, comedy<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n<div style=\"height:80px\"><\u002Fdiv>\n<\u002Fsection>\n\n<!-- marquee -->\n<div style=\"background:#DD007A;padding:20px 0;overflow:hidden\" data-screen-label=\"Marquee\">\n  <div data-marquee=\"1\" style=\"display:inline-flex;white-space:nowrap;will-change:transform\">\n    <span style=\"font-family:'Anton',sans-serif;font-size:clamp(22px,2.6vw,36px);letter-spacing:.1em;text-transform:uppercase;color:#FFFFFF\">One box<span style=\"display:inline-block;width:.62em;height:.62em;background:#FFFFFF;margin:0 .5em;vertical-align:.02em\"><\u002Fspan>Four gifts<span style=\"display:inline-block;width:.62em;height:.62em;background:#FFFFFF;margin:0 .5em;vertical-align:.02em\"><\u002Fspan>One very curious flamingo<span style=\"display:inline-block;width:.62em;height:.62em;background:#FFFFFF;margin:0 .5em;vertical-align:.02em\"><\u002Fspan>One box<span style=\"display:inline-block;width:.62em;height:.62em;background:#FFFFFF;margin:0 .5em;vertical-align:.02em\"><\u002Fspan>Four gifts<span style=\"display:inline-block;width:.62em;height:.62em;background:#FFFFFF;margin:0 .5em;vertical-align:.02em\"><\u002Fspan>One very curious flamingo<span style=\"display:inline-block;width:.62em;height:.62em;background:#FFFFFF;margin:0 .5em;vertical-align:.02em\"><\u002Fspan><\u002Fspan>\n    <span style=\"font-family:'Anton',sans-serif;font-size:clamp(22px,2.6vw,36px);letter-spacing:.1em;text-transform:uppercase;color:#FFFFFF\">One box<span style=\"display:inline-block;width:.62em;height:.62em;background:#FFFFFF;margin:0 .5em;vertical-align:.02em\"><\u002Fspan>Four gifts<span style=\"display:inline-block;width:.62em;height:.62em;background:#FFFFFF;margin:0 .5em;vertical-align:.02em\"><\u002Fspan>One very curious flamingo<span style=\"display:inline-block;width:.62em;height:.62em;background:#FFFFFF;margin:0 .5em;vertical-align:.02em\"><\u002Fspan>One box<span style=\"display:inline-block;width:.62em;height:.62em;background:#FFFFFF;margin:0 .5em;vertical-align:.02em\"><\u002Fspan>Four gifts<span style=\"display:inline-block;width:.62em;height:.62em;background:#FFFFFF;margin:0 .5em;vertical-align:.02em\"><\u002Fspan>One very curious flamingo<span style=\"display:inline-block;width:.62em;height:.62em;background:#FFFFFF;margin:0 .5em;vertical-align:.02em\"><\u002Fspan><\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ========== 03 THE STORY (dark chapter) ========== -->\n<section id=\"story\" data-screen-label=\"The Story\" style=\"background:#191419\">\n<div style=\"min-height:92vh;display:flex;align-items:center;position:relative;overflow:hidden\">\n  <div style=\"position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:60vw;height:60vw;background:radial-gradient(circle,rgba(221,0,122,.22) 0%,rgba(221,0,122,0) 65%);pointer-events:none\"><\u002Fdiv>\n  <div style=\"width:100%;max-width:1400px;margin:0 auto;padding:120px 6vw;position:relative\">\n    <div style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#F7A9D2;margin-bottom:32px\">03 / 10 — The Story · six beats · 30 seconds<\u002Fdiv>\n    <h2 style=\"margin:0;line-height:.94\">\n      <span style=\"display:block;font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(48px,8.4vw,140px);color:#FFFFFF\">One box.<\u002Fspan>\n      <span style=\"display:block;font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(48px,8.4vw,140px);color:transparent;-webkit-text-stroke:2px #DD007A\">Four gifts.<\u002Fspan>\n      <span style=\"display:block;font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:clamp(48px,8.4vw,140px);color:#FFFFFF\">One very curious<\u002Fspan>\n      <span style=\"display:block;font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:clamp(60px,11vw,180px);color:#DD007A\">flamingo.<\u002Fspan>\n    <\u002Fh2>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Beat 1 -->\n<div style=\"max-width:1400px;margin:0 auto;padding:60px 6vw 0 6vw;position:relative\" data-screen-label=\"Beat 1 — Christmas Morning\">\n  <div style=\"position:relative;padding-top:clamp(30px,4vw,60px)\">\n    <div style=\"position:absolute;top:0;left:-1vw;font-family:'Anton',sans-serif;font-size:clamp(120px,17vw,260px);line-height:1;color:transparent;-webkit-text-stroke:2px rgba(221,0,122,.5);user-select:none\">01<\u002Fdiv>\n    <h3 style=\"position:relative;margin:0 0 20px 0;font-family:'Instrument Serif',serif;font-weight:400;font-style:italic;font-size:clamp(44px,6vw,92px);color:#FFFFFF;padding-left:clamp(60px,9vw,150px)\">Christmas Morning<\u002Fh3>\n    <div style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#DD007A;padding-left:clamp(60px,9vw,150px);margin-bottom:52px\">[ INT. FAMILY LIVING ROOM — BEFORE DAWN ]<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"position:relative\" data-reveal=\"1\">\n    <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#221C26,#221C26 14px,#2A2330 14px,#2A2330 28px);border:1px dashed #6b4a63;aspect-ratio:21/9\">\n      <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#E9A8CC;background:rgba(20,16,22,.8);padding:9px 16px;text-transform:uppercase;text-align:center\">Image/GIF — Christmas morning, the house still asleep<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"position:relative;background:#FDFBFC;max-width:620px;margin:-70px 0 0 clamp(20px,5vw,80px);padding:clamp(32px,4vw,56px)\">\n      <p style=\"margin:0 0 8px 0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.66;color:#3D3C3C\">It is Christmas morning, and the whole house is still asleep.<\u002Fp>\n      <p style=\"margin:0 0 26px 0;font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(24px,2.4vw,32px);line-height:1.3;color:#DD007A\">The whole house, that is, except Eddie.<\u002Fp>\n      <p style=\"margin:0 0 22px 0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.66;color:#3D3C3C\">He's clearly been awake for some time, and now that Christmas has finally arrived there is absolutely no chance of him going back to sleep. He quietly sneaks downstairs, doing his very best not to wake anybody as he makes his way towards the presents beneath the tree.<\u002Fp>\n      <p style=\"margin:0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.66;color:#3D3C3C\">As he passes a framed family photograph, we catch a glimpse of Rebecca, Vince, Yazmin and Eddie together. It's a tiny moment, but it establishes our family before we start diving into their individual worlds.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(40px,7vw,110px);align-items:center;margin-top:90px\">\n    <div data-reveal=\"1\">\n      <p style=\"margin:0 0 30px 0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.66;color:#EDE6EC\">Eddie reaches the tree, decorated with Very boxes, and spots one prominent box with a label reading <em style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-style:normal;color:#F7A9D2\">‘The Flock’<\u002Fem>. A warm <em style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:1.15em;color:#DD007A\">pink glow<\u002Fem> is escaping from beneath its lid.<\u002Fp>\n      <p style=\"margin:0 0 30px 0;font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(34px,4.2vw,58px);line-height:1.15;color:#DD007A\">“What is this…?”<\u002Fp>\n      <p style=\"margin:0 0 26px 0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.66;color:#EDE6EC\">Eddie looks around the room to make sure nobody has seen him. He looks back at the box. Curiosity gets the better of him. He opens the lid, and the glow floods across the room.<\u002Fp>\n      <p style=\"margin:0;line-height:1.25\">\n        <span style=\"font-weight:300;font-size:clamp(15px,1.36vw,19px);color:#EDE6EC\">With excitement, <\u002Fspan>\n        <span style=\"font-family:'Anton',sans-serif;text-transform:uppercase;font-size:clamp(24px,2.6vw,38px);color:#FFFFFF\">Eddie dives inside<\u002Fspan>\n        <span style=\"font-weight:300;font-size:clamp(15px,1.36vw,19px);color:#EDE6EC\"> and <\u002Fspan>\n        <span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(26px,2.8vw,42px);color:#DD007A\">disappears.<\u002Fspan>\n      <\u002Fp>\n    <\u002Fdiv>\n    <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#221C26,#221C26 14px,#2A2330 14px,#2A2330 28px);border:1px dashed #6b4a63;aspect-ratio:1/1\" data-reveal=\"1\">\n      <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#E9A8CC;background:rgba(20,16,22,.8);padding:9px 16px;text-transform:uppercase;text-align:center\">Image — ‘The Flock’ box, pink glow under the lid<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Beat 2 -->\n<div style=\"max-width:1400px;margin:0 auto;padding:140px 6vw 0 6vw\" data-screen-label=\"Beat 2 — Yazmin's World\">\n  <div style=\"position:relative;padding-top:clamp(30px,4vw,60px)\">\n    <div style=\"position:absolute;top:0;left:-1vw;font-family:'Anton',sans-serif;font-size:clamp(120px,17vw,260px);line-height:1;color:transparent;-webkit-text-stroke:2px rgba(221,0,122,.5);user-select:none\">02<\u002Fdiv>\n    <h3 style=\"position:relative;margin:0 0 20px 0;font-family:'Instrument Serif',serif;font-weight:400;font-style:italic;font-size:clamp(44px,6vw,92px);color:#FFFFFF;padding-left:clamp(60px,9vw,150px)\">Yazmin's World<\u002Fh3>\n    <div style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#DD007A;padding-left:clamp(60px,9vw,150px);margin-bottom:52px\">[ EXT. MOUNTAIN RIDGE — CRISP AIR, HUGE SKIES ]<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(40px,6vw,90px);align-items:start\">\n    <div data-reveal=\"1\">\n      <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#221C26,#221C26 14px,#2A2330 14px,#2A2330 28px);border:1px dashed #6b4a63;aspect-ratio:16/9\">\n        <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#E9A8CC;background:rgba(20,16,22,.8);padding:9px 16px;text-transform:uppercase;text-align:center\">Image/GIF — Mountain world, Yazmin's peace sign<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#221C26,#221C26 14px,#2A2330 14px,#2A2330 28px);border:1px dashed #6b4a63;aspect-ratio:16/9;margin-top:22px\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#E9A8CC;background:rgba(20,16,22,.8);padding:9px 16px;text-transform:uppercase;text-align:center\">Image — Crisp air, huge skies, rugged peaks<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div data-reveal=\"1\">\n      <p style=\"margin:0 0 22px 0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.66;color:#EDE6EC\">Eddie tumbles out of the pink glow and lands on the edge of a spectacular mountain landscape. Crisp air, huge skies and rugged peaks stretch out in every direction. Before he has time to take it all in, he hears a whistle.<\u002Fp>\n      <p style=\"margin:0 0 10px 0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.66;color:#EDE6EC\">Eddie looks up.<\u002Fp>\n      <p style=\"margin:0 0 26px 0;font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(22px,2.2vw,30px);line-height:1.35;color:#F7A9D2\">Yazmin is already halfway up the mountain, completely in her element.<\u002Fp>\n      <p style=\"margin:0 0 34px 0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.66;color:#EDE6EC\">She throws him a quick peace sign before disappearing around the next bend.<\u002Fp>\n      <p style=\"margin:0 0 34px 0;line-height:1\"><span style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(22px,2.2vw,30px);color:#EDE6EC\">Then, <\u002Fspan><span style=\"font-family:'Anton',sans-serif;font-size:clamp(38px,4.6vw,64px);letter-spacing:.06em;text-transform:uppercase;color:#DD007A\">crunch.<\u002Fspan><\u002Fp>\n      <p style=\"margin:0 0 22px 0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.66;color:#EDE6EC\">Eddie turns to see a billy goat standing beside a Very box, happily chewing away on its lid. Eddie pulls the lid away from the goat and falls backwards into the box, disappearing into the familiar pink glow.<\u002Fp>\n      <p style=\"margin:0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.66;color:#EDE6EC\">The goat, now alone, swallows its cardboard and licks its lips.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"width:100vw;margin:64px 0 0 calc(50% - 50vw);overflow:hidden\">\n  <div data-marquee-carousel=\"1\" style=\"display:flex;gap:22px;width:max-content;will-change:transform\">\n    <div data-mc-run=\"1\" style=\"display:flex;gap:22px;padding-right:22px\">\n          <div style=\"flex:0 0 auto;width:clamp(300px,26vw,460px);aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#221C26,#221C26 14px,#2A2330 14px,#2A2330 28px);border:1px dashed #6b4a63\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#E9A8CC;background:rgba(20,16,22,.8);padding:8px 12px;text-transform:uppercase;text-align:center\">Image — The goat, mid-chew<\u002Fspan><\u002Fdiv>\n          <div style=\"flex:0 0 auto;width:clamp(300px,26vw,460px);aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#221C26,#221C26 14px,#2A2330 14px,#2A2330 28px);border:1px dashed #6b4a63\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#E9A8CC;background:rgba(20,16,22,.8);padding:8px 12px;text-transform:uppercase;text-align:center\">Image — Eddie pulls the lid away<\u002Fspan><\u002Fdiv>\n          <div style=\"flex:0 0 auto;width:clamp(300px,26vw,460px);aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#221C26,#221C26 14px,#2A2330 14px,#2A2330 28px);border:1px dashed #6b4a63\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#E9A8CC;background:rgba(20,16,22,.8);padding:8px 12px;text-transform:uppercase;text-align:center\">Image — Eddie falls into the pink glow<\u002Fspan><\u002Fdiv>\n          <div style=\"flex:0 0 auto;width:clamp(300px,26vw,460px);aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#221C26,#221C26 14px,#2A2330 14px,#2A2330 28px);border:1px dashed #6b4a63\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#E9A8CC;background:rgba(20,16,22,.8);padding:8px 12px;text-transform:uppercase;text-align:center\">Image — The goat licks its lips<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div data-mc-run=\"1\" style=\"display:flex;gap:22px;padding-right:22px\">\n          <div style=\"flex:0 0 auto;width:clamp(300px,26vw,460px);aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#221C26,#221C26 14px,#2A2330 14px,#2A2330 28px);border:1px dashed #6b4a63\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#E9A8CC;background:rgba(20,16,22,.8);padding:8px 12px;text-transform:uppercase;text-align:center\">Image — The goat, mid-chew<\u002Fspan><\u002Fdiv>\n          <div style=\"flex:0 0 auto;width:clamp(300px,26vw,460px);aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#221C26,#221C26 14px,#2A2330 14px,#2A2330 28px);border:1px dashed #6b4a63\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#E9A8CC;background:rgba(20,16,22,.8);padding:8px 12px;text-transform:uppercase;text-align:center\">Image — Eddie pulls the lid away<\u002Fspan><\u002Fdiv>\n          <div style=\"flex:0 0 auto;width:clamp(300px,26vw,460px);aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#221C26,#221C26 14px,#2A2330 14px,#2A2330 28px);border:1px dashed #6b4a63\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#E9A8CC;background:rgba(20,16,22,.8);padding:8px 12px;text-transform:uppercase;text-align:center\">Image — Eddie falls into the pink glow<\u002Fspan><\u002Fdiv>\n          <div style=\"flex:0 0 auto;width:clamp(300px,26vw,460px);aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#221C26,#221C26 14px,#2A2330 14px,#2A2330 28px);border:1px dashed #6b4a63\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#E9A8CC;background:rgba(20,16,22,.8);padding:8px 12px;text-transform:uppercase;text-align:center\">Image — The goat licks its lips<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Beat 3 -->\n<div style=\"max-width:1400px;margin:0 auto;padding:140px 6vw 0 6vw\" data-screen-label=\"Beat 3 — Dad's World\">\n  <div style=\"position:relative;padding-top:clamp(30px,4vw,60px)\">\n    <div style=\"position:absolute;top:0;left:-1vw;font-family:'Anton',sans-serif;font-size:clamp(120px,17vw,260px);line-height:1;color:transparent;-webkit-text-stroke:2px rgba(221,0,122,.5);user-select:none\">03<\u002Fdiv>\n    <h3 style=\"position:relative;margin:0 0 20px 0;font-family:'Instrument Serif',serif;font-weight:400;font-style:italic;font-size:clamp(44px,6vw,92px);color:#FFFFFF;padding-left:clamp(60px,9vw,150px)\">Dad's World<\u002Fh3>\n    <div style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#DD007A;padding-left:clamp(60px,9vw,150px);margin-bottom:52px\">[ EXT. COFFEE FIELDS, VIETNAM — GOLDEN LIGHT ]<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(40px,6vw,90px);align-items:center\">\n    <div data-reveal=\"1\">\n      <p style=\"margin:0 0 22px 0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.66;color:#EDE6EC\">Eddie lands feet first amongst lush green foliage. Sunlight filters through the canopy and rows of coffee plants disappear into the distance. We're in the <em style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:1.15em;color:#F7A9D2\">luscious Vietnamese countryside<\u002Fem>.<\u002Fp>\n      <p style=\"margin:0 0 22px 0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.66;color:#EDE6EC\">This is a world of rich textures, humidity, steam and the intoxicating smell of freshly prepared coffee. We see an iconic-looking Vince right at home with the locals, getting involved in the ritual of making it, taking a big, satisfying sniff of the freshly prepared coffee with his robust beak. Dad finally takes a sip.<\u002Fp>\n      <p style=\"margin:0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.66;color:#EDE6EC\">His expression says everything.<\u002Fp>\n    <\u002Fdiv>\n    <div data-reveal=\"1\">\n      <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#221C26,#221C26 14px,#2A2330 14px,#2A2330 28px);border:1px dashed #6b4a63;aspect-ratio:16/9\">\n        <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#E9A8CC;background:rgba(20,16,22,.8);padding:9px 16px;text-transform:uppercase;text-align:center\">Image/GIF — Vietnamese coffee fields, golden light<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p style=\"margin:36px auto;font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(32px,3.8vw,52px);line-height:1.15;color:#DD007A;text-align:center;max-width:20em\" data-reveal=\"1\">This is life-changing coffee.<\u002Fp>\n  <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,3.5vw,48px) clamp(40px,6vw,90px);align-items:start\" data-reveal=\"1\">\n    <p style=\"margin:0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.66;color:#EDE6EC\">Then, amongst the coffee being packed onto a truck, Eddie spots another Very box on the back of it, its lid already open and that familiar pink glow emanating from within.<\u002Fp>\n    <p style=\"margin:0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.66;color:#EDE6EC\">He weaves between the coffee sacks as Dad remains completely absorbed in his new favourite ritual. Just as the truck is about to pull away, Eddie <em style=\"font-family:'Anton',sans-serif;font-style:normal;text-transform:uppercase;font-size:1.1em;color:#FFFFFF\">launches himself<\u002Fem> towards it and disappears inside.<\u002Fp>\n    <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#221C26,#221C26 14px,#2A2330 14px,#2A2330 28px);border:1px dashed #6b4a63;aspect-ratio:16/9\">\n      <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#E9A8CC;background:rgba(20,16,22,.8);padding:9px 16px;text-transform:uppercase;text-align:center\">Image — Vince's first sip<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#221C26,#221C26 14px,#2A2330 14px,#2A2330 28px);border:1px dashed #6b4a63;aspect-ratio:16/9\">\n      <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#E9A8CC;background:rgba(20,16,22,.8);padding:9px 16px;text-transform:uppercase;text-align:center\">Image — Eddie leaps for the truck<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Beat 4 -->\n<div style=\"max-width:1400px;margin:0 auto;padding:140px 6vw 0 6vw\" data-screen-label=\"Beat 4 — Mum's World\">\n  <div style=\"position:relative;padding-top:clamp(30px,4vw,60px)\">\n    <div style=\"position:absolute;top:0;left:-1vw;font-family:'Anton',sans-serif;font-size:clamp(120px,17vw,260px);line-height:1;color:transparent;-webkit-text-stroke:2px rgba(221,0,122,.5);user-select:none\">04<\u002Fdiv>\n    <h3 style=\"position:relative;margin:0 0 20px 0;font-family:'Instrument Serif',serif;font-weight:400;font-style:italic;font-size:clamp(44px,6vw,92px);color:#FFFFFF;padding-left:clamp(60px,9vw,150px)\">Mum's World<\u002Fh3>\n    <div style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#DD007A;padding-left:clamp(60px,9vw,150px);margin-bottom:52px\">[ INT. TURKISH BATH SPA — SOFT, LUXURIOUS LIGHT ]<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(40px,6vw,90px);align-items:center\" data-reveal=\"1\">\n    <div>\n      <p style=\"margin:0 0 22px 0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.66;color:#EDE6EC\">Eddie rolls out of a cloud of warm steam, surrounded by a faint pink glow.<\u002Fp>\n      <p style=\"margin:0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.66;color:#EDE6EC\">As the steam disperses, a beautiful Turkish bath-inspired spa is revealed. Marble, warm stone, ornate architectural details and soft, luxurious light create the ultimate escape. Mum is reclining on a plush spa bed in a beautiful fluffy robe, her beauty products resting nearby. After the energy of the mountain and the activity of Dad's coffee world, everything here feels <em style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:1.15em;color:#DD007A\">wonderfully slow<\u002Fem>.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#221C26,#221C26 14px,#2A2330 14px,#2A2330 28px);border:1px dashed #6b4a63;aspect-ratio:16/9\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#E9A8CC;background:rgba(20,16,22,.8);padding:9px 16px;text-transform:uppercase;text-align:center\">Image/GIF — Turkish bath spa, Mum at peace<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <p style=\"margin:44px auto;max-width:22em;font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(28px,3.4vw,48px);line-height:1.2;color:#F7A9D2;text-align:center\" data-reveal=\"1\">She is completely at peace.<\u002Fp>\n\n  <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(40px,6vw,90px);align-items:center\" data-reveal=\"1\">\n    <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#221C26,#221C26 14px,#2A2330 14px,#2A2330 28px);border:1px dashed #6b4a63;aspect-ratio:16/9\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#E9A8CC;background:rgba(20,16,22,.8);padding:9px 16px;text-transform:uppercase;text-align:center\">Image — The Very box, floating in the pool<\u002Fspan><\u002Fdiv>\n    <div>\n      <p style=\"margin:0 0 22px 0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.66;color:#EDE6EC\">Eddie carefully makes his way through the spa, trying not to disturb her, when he spots another Very box. But this one is floating in the middle of the pool.<\u002Fp>\n      <p style=\"margin:0 0 18px 0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.66;color:#EDE6EC\">With no other option, Eddie takes an ambitious <em style=\"font-family:'Anton',sans-serif;font-style:normal;text-transform:uppercase;font-size:1.1em;color:#DD007A\">running bomb jump<\u002Fem>.<\u002Fp>\n      <p style=\"margin:0;font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(21px,2vw,27px);color:#EDE6EC\">For a moment, it looks like he's going to miss.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(40px,6vw,90px);align-items:center;margin-top:clamp(40px,5vw,72px)\" data-reveal=\"1\">\n    <div>\n      <p style=\"margin:0 0 26px 0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.66;color:#EDE6EC\">Then, at the very last second, he skims perfectly into the box and is swallowed by the pink glow. A little feather floats gently upwards in his wake.<\u002Fp>\n      <p style=\"margin:0 0 10px 0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.66;color:#EDE6EC\">Mum suddenly thinks she hears something.<\u002Fp>\n      <p style=\"margin:0;font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(21px,2vw,27px);color:#F7A9D2\">She turns. Nothing.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px\">\n      <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#221C26,#221C26 14px,#2A2330 14px,#2A2330 28px);border:1px dashed #6b4a63;aspect-ratio:16/9\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#E9A8CC;background:rgba(20,16,22,.8);padding:9px 16px;text-transform:uppercase;text-align:center\">Image — The bomb jump<\u002Fspan><\u002Fdiv>\n      <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#221C26,#221C26 14px,#2A2330 14px,#2A2330 28px);border:1px dashed #6b4a63;aspect-ratio:16/9\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#E9A8CC;background:rgba(20,16,22,.8);padding:9px 16px;text-transform:uppercase;text-align:center\">Image — A single feather floats up<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Beat 5 — space -->\n<div style=\"background:#0E0B12;margin-top:140px;position:relative;overflow:hidden\" data-screen-label=\"Beat 5 — Eddie's World\">\n  <div style=\"position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);width:80vw;height:80vw;background:radial-gradient(circle,rgba(221,0,122,.18) 0%,rgba(140,80,200,.1) 40%,rgba(14,11,18,0) 70%);pointer-events:none\"><\u002Fdiv>\n  <div style=\"max-width:1400px;margin:0 auto;padding:110px 6vw 0 6vw;position:relative\">\n    <div style=\"position:relative;padding-top:clamp(30px,4vw,60px)\">\n      <div style=\"position:absolute;top:0;left:-1vw;font-family:'Anton',sans-serif;font-size:clamp(120px,17vw,260px);line-height:1;color:transparent;-webkit-text-stroke:2px rgba(221,0,122,.5);user-select:none\">05<\u002Fdiv>\n      <h3 style=\"position:relative;margin:0 0 20px 0;font-family:'Instrument Serif',serif;font-weight:400;font-style:italic;font-size:clamp(44px,6vw,92px);color:#FFFFFF;padding-left:clamp(60px,9vw,150px)\">Eddie's World<\u002Fh3>\n      <div style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#DD007A;padding-left:clamp(60px,9vw,150px);margin-bottom:52px\">[ EXT. OUTER SPACE — WEIGHTLESS ]<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"max-width:840px\" data-reveal=\"1\">\n      <p style=\"margin:0 0 22px 0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.66;color:#EDE6EC\">Cut to Eddie drifting weightlessly through space. His teddy floats past him in a matching miniature spacesuit before Eddie reaches out and catches it.<\u002Fp>\n      <p style=\"margin:0 0 40px 0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.66;color:#EDE6EC\">A beautiful soft pink light catches their suits as Eddie turns to see the universe opening up around him, vast clouds of <em style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:1.15em;color:#F7A9D2\">pink and purple gases<\u002Fem> floating majestically through the darkness.<\u002Fp>\n      <p style=\"margin:0;font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(24px,2.4vw,34px);color:#F7A9D2\">And then we see it.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"text-align:center;padding:10vh 6vw 6vh 6vw;position:relative\" data-reveal=\"1\">\n    <p style=\"margin:0;font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;font-size:clamp(56px,10vw,164px);line-height:1;color:#FFFFFF\">The Milky Way.<\u002Fp>\n    <p style=\"margin:24px 0 0 0;font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(20px,2vw,28px);color:#E9A8CC\">impossibly vast — and beautiful<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#15111C,#15111C 14px,#1C1626 14px,#1C1626 28px);border-top:1px dashed #6b4a63;border-bottom:1px dashed #6b4a63;min-height:82vh\" data-reveal=\"1\">\n    <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#E9A8CC;background:rgba(14,11,18,.8);padding:12px 20px;text-transform:uppercase;text-align:center\">Image/GIF — Full-bleed: the Milky Way opens up around Eddie<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"max-width:1400px;margin:0 auto;padding:90px 6vw 110px 6vw;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(40px,6vw,90px);align-items:start\">\n    <div data-reveal=\"1\">\n      <p style=\"margin:0 0 22px 0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.66;color:#EDE6EC\">It stretches across the darkness in front of him, impossibly vast and beautiful.<\u002Fp>\n      <p style=\"margin:0 0 22px 0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.66;color:#EDE6EC\">We move in close on Eddie as the entire galaxy is reflected in the glass of his helmet. His eyes widen with wonder.<\u002Fp>\n      <p style=\"margin:0 0 30px 0;font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(24px,2.4vw,34px);line-height:1.3;color:#F7A9D2\">For once, Eddie has absolutely nothing to say.<\u002Fp>\n      <p style=\"margin:0 0 44px 0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.66;color:#EDE6EC\">The scale is genuinely breathtaking, but the emotion remains beautifully simple: <em style=\"font-family:'Instrument Serif',serif;font-style:italic;font-size:1.15em;color:#F7A9D2\">a little boy seeing something he never imagined he would see<\u002Fem>.<\u002Fp>\n      <p style=\"margin:0 0 16px 0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.66;color:#EDE6EC\">Then, faintly:<\u002Fp>\n      <p style=\"margin:0;font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(34px,4.2vw,58px);line-height:1.15;color:#DD007A\">“Earth to Eddie…”<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:24px\" data-reveal=\"1\">\n      <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#15111C,#15111C 14px,#1C1626 14px,#1C1626 28px);border:1px dashed #6b4a63;aspect-ratio:16/9\">\n        <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#E9A8CC;background:rgba(14,11,18,.8);padding:9px 16px;text-transform:uppercase;text-align:center\">Image — The galaxy reflected in Eddie's helmet<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#15111C,#15111C 14px,#1C1626 14px,#1C1626 28px);border:1px dashed #6b4a63;aspect-ratio:16/9\">\n        <span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#E9A8CC;background:rgba(14,11,18,.8);padding:9px 16px;text-transform:uppercase;text-align:center\">Image — Match cut: salad bowl, fairy lights as stars<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Beat 6 -->\n<div style=\"max-width:1400px;margin:0 auto;padding:120px 6vw 0 6vw\" data-screen-label=\"Beat 6 — Aced Christmas\">\n  <div style=\"position:relative;padding-top:clamp(30px,4vw,60px)\">\n    <div style=\"position:absolute;top:0;left:-1vw;font-family:'Anton',sans-serif;font-size:clamp(120px,17vw,260px);line-height:1;color:transparent;-webkit-text-stroke:2px rgba(221,0,122,.5);user-select:none\">06<\u002Fdiv>\n    <h3 style=\"position:relative;margin:0 0 20px 0;font-family:'Instrument Serif',serif;font-weight:400;font-style:italic;font-size:clamp(44px,6vw,92px);color:#FFFFFF;padding-left:clamp(60px,9vw,150px)\">Back Home<\u002Fh3>\n    <div style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#DD007A;padding-left:clamp(60px,9vw,150px);margin-bottom:52px\">[ INT. FAMILY LIVING ROOM — MATCH CUT ]<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(40px,6vw,90px);align-items:center\" data-reveal=\"1\">\n    <div>\n      <p style=\"margin:0 0 22px 0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.66;color:#EDE6EC\">We match cut to the living room. Eddie is standing beneath the Christmas tree with a glass salad bowl on his head, completely lost in his own little universe. The fairy lights and star on the tree echo the constellation we have just seen.<\u002Fp>\n      <p style=\"margin:0;font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(24px,2.4vw,34px);line-height:1.3;color:#F7A9D2\">He slowly removes the bowl. He's home.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#221C26,#221C26 14px,#2A2330 14px,#2A2330 28px);border:1px dashed #6b4a63;aspect-ratio:16/9\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#E9A8CC;background:rgba(20,16,22,.8);padding:9px 16px;text-transform:uppercase;text-align:center\">Image — Eddie lifts the salad bowl<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(40px,6vw,90px);align-items:center;margin-top:clamp(40px,5vw,72px)\" data-reveal=\"1\">\n    <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#221C26,#221C26 14px,#2A2330 14px,#2A2330 28px);border:1px dashed #6b4a63;aspect-ratio:16/9\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#E9A8CC;background:rgba(20,16,22,.8);padding:9px 16px;text-transform:uppercase;text-align:center\">Image — The family beneath the tree<\u002Fspan><\u002Fdiv>\n    <div>\n      <p style=\"margin:0 0 22px 0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.66;color:#EDE6EC\">The rest of the family are gathered around the tree with their presents. Vince is already assessing the settings on his coffee machine, Yazmin is checking the gears on her bike, and Rebecca is enjoying her beauty gift. Eddie lifts an incredibly crafted rocket from his Very box.<\u002Fp>\n      <p style=\"margin:0 0 12px 0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.66;color:#EDE6EC\">Then, in the background, a goat's head suddenly appears from inside a Very box. It grabs the lid and disappears again.<\u002Fp>\n      <p style=\"margin:0;font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(21px,2vw,27px);color:#F7A9D2\">Nobody seems to notice.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"margin-top:clamp(40px,5vw,72px)\" data-reveal=\"1\"><div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#221C26,#221C26 14px,#2A2330 14px,#2A2330 28px);border:1px dashed #6b4a63;aspect-ratio:21/9\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#E9A8CC;background:rgba(20,16,22,.8);padding:9px 16px;text-transform:uppercase;text-align:center\">Image — The goat cameo, in the background<\u002Fspan><\u002Fdiv><\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(40px,6vw,90px);align-items:stretch;margin-top:clamp(40px,5vw,72px);padding-bottom:130px\" data-reveal=\"1\">\n    <div style=\"position:relative;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#221C26,#221C26 14px,#2A2330 14px,#2A2330 28px);border:1px dashed #6b4a63;aspect-ratio:16/9\"><span style=\"font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:12px;letter-spacing:.1em;color:#E9A8CC;background:rgba(20,16,22,.8);padding:9px 16px;text-transform:uppercase;text-align:center\">Image — Eddie lifts the rocket from his Very box<\u002Fspan><\u002Fdiv>\n    <div style=\"background:#DD007A;display:flex;flex-direction:column;justify-content:center;padding:clamp(40px,5vw,72px)\">\n      <p style=\"margin:0 0 20px 0;font-weight:300;font-size:clamp(15px,1.36vw,19px);line-height:1.66;color:rgba(255,255,255,.92)\">In the final moment, we simply see them all together beneath the tree, surrounded by their presents.<\u002Fp>\n      <p style=\"margin:0;line-height:1\">\n        <span style=\"font-family:'Anton',sans-serif;text-transform:uppercase;font-siz
